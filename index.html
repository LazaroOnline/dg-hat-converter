<!DOCTYPE html>
<html>

    <head>
        <title>Hat Converter for Duck Game - .hat to .png</title>
        <link rel="icon" type="image/x-icon" href="icon.png">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="">
        <link href="hat-converter.css" rel="stylesheet" />
    </head>

    <body>
      <div class="flex" id="dropArea">
        <div class="content" id="uploadbox">
            <div class="top-info">
              <div>
                <h1>Hat Converter for Duck Game</h1>
                <p><label>Drag or select .hat files here to convert to PNG. <input type="file" name="" id="upload" multiple></label></p>
              </div>
              <div class="visibleAfterLoad">
                <p>Click on a hat to download the PNG image.</p>
                <a id="downloadZip" tabindex="-1"><button class="btn btn-main">Download All as ZIP</button></a>
              </div>
              <div class="button-list">
                <label class="zoom-container visibleAfterLoad">Zoom
                  <input type="range" title="zoom" id="zoomSlider" min="100" max="1000" value="200" />
                </label>
                <div class="color-dropdown visibleAfterLoad">
                  <button id="toggle-overlay-colors"
                    class="btn btn-press btn-circle btn-colors visibleAfterLoad"
                    aria-haspopup="menu" aria-expanded="false"
                    title="Change hat duck overlay color (Shift+C)">
                    <div>🎨</div>
                  </button>
                  <div class="menu"></div>
                  <template id="color-template">
                    <button class="btn btn-press btn-color-option" tabindex="-1"><div></div></button>
                  </template>
                </div>
                <button id="toggle-overlays" class="btn btn-press btn-circle btn-overlay visibleAfterLoad" title="Toggle hat overlay visibility (Shift+V)"></button>
                <button id="toggle-dark-mode" class="btn btn-press btn-circle btn-dark" title="Toggle Dark Mode (Shift+D)">
                  <div>🌞</div><div class="moon">🌛</div>
                </button>
                <a target="blank" href="https://github.com/LazaroOnline/dg-hat-converter" 
                 class="btn btn-press btn-small btn-github"
                 title="Source code at GitHub">
                  <svg height="37" width="37" viewBox="0 0 16 16" style="fill:rgb(200, 200, 200)">
                    <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
                  </svg>
                </a>
              </div>
            </div>

            <div id="hats">
                <div class="btn-clear-container">
                  <button id="clear-hats" class="btn btn-press btn-circle btn-clear visibleAfterLoad" title="Clear all loaded hats.">
                    <div>ⓧ</div>
                  </button>
                </div>
                <div id="hats-output">
                    <!-- Hat previews will be added here -->
                     
                </div>
                <template id="hat-template">
                    <div class="duck-out">
                      <div class="title" title="">Title here</div>
                      <a href="" download="">
                        <div class="hat-image-container">
                            <div>
                              <img class="hat-image-overlay hat-image-overlay-body" src="" alt="" style="display: none"/>
                              <img class="hat-image-overlay hat-image-overlay-wing" src="" alt="" style="display: none"/>
                            </div>
                            <div>
                              <img class="hat-image" src="" alt="" />
                            </div>
                        </div>
                      </a>
                    </div>
                </template>
            </div>
        </div>
        <div class="info">
            <p>Hat files are converted in your browser and not sent or stored anywhere.
              <a target="blank" href="https://duckgame.fandom.com/wiki/Custom_Hats">Information</a>
               -
              <a target="blank" href="https://github.com/LazaroOnline/dg-hat-converter">Source code</a>
            </p>
        </div>
      </div>
    </body>
    <script src="hat-converter.js"></script>
    <script src="jszip.min.js"></script>
</html>
